<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./css/formulario.css">
</head>
<body>
        <h1>RESERVE SEU HOTEL</h1>
    <div class="container">
        <form>
            <div class="form-control">
                <label for="nome">Nome completo</label>
                <input type="text" id="nome"/>
            </div>

            <div class="form-control">
                <label for="email">Email de contato</label>
                <input type="email" id="email">
            </div>

             <div class="form-control">
                <label for="senha">Senha</label>
                <input type="password" id="senha"/>
            </div>

            <div class="form-control">
                <label for="telefone">Número de telefone</label>
                <input type="number" id="telefone">
            </div>

            <div class="form-control">
                <label for="destino">Escolha seu destino:</label>
                <select id="destino">
                    <option value="">Selecione</option>
                    <option value="porto">Porto de galinhas(PE)</option>
                    <option value="fernando">Fernando de noronha(PE)</option>
                    <option value="gramado">Gramado(RS)</option>
                    <option value="lencois">Lençoís Maranhenses(MA)</option>
                    <option value="jalapao">Jalapão(TO)</option>

                    <option value="ilhabela">Ilhabela(SP)</option>
                </select>
            </div>

            <div class="form-control">
                <label for="data">Data de check-in</label>
                <input type="datetime-local" id="data">
            </div>

            <div class="form-control">
                <label for="data-saida">Data de check-out</label>
                <input type="datetime-local" id="data-saida">
            </div>

            <div class="form-control">
                <label for="hospedes">Número de hospedes:</label>
                <select id="hospedes">
                    <option value="">Selecione</option>
                    <option value="">1</option>
                    <option value="">2</option>
                    <option value="">3</option>
                    <option value="">4</option>
                    <option value="">5</option>
                    <option value="">6</option>
                </select>
            </div>

            <div class="form-control">
                <label for="quarto">Tipo de quarto:</label>
                <select id="quarto">
                    <option value="">Selecione</option>
                    <option value="individual">Quarto individual</option>
                    <option value="duplo">Quarto duplo</option>
                    <option value="triplo">Quarto triplo</option>
                    <option value="suite">Suíte</option>
                    <option value="luxo">Suíte de luxo</option>
                </select>
            </div>

            <div class="form-control">
                <button type="submit" class="btn-reservar">Reservar</button>
                <button type="reset" class="btn-limpar">Limpar</button>
            </div>

        </form>
    </div>
</body>
</html>
